<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Liam Gregor Portfolio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>

  <!-- Access denied screen (shown until auth check passes) -->
  <div id="admin-loading" class="admin-gate">
    <div class="spinner"></div>
  </div>

  <div id="admin-denied" class="admin-gate hidden">
    <div class="admin-gate-box">
      <p style="font-size:2.5rem">🔒</p>
      <h2>Access Denied</h2>
      <p>This page is only accessible to the site admin.</p>
      <a href="/" class="btn-primary" style="margin-top:20px; display:inline-block">← Go home</a>
    </div>
  </div>

  <!-- Admin app (shown only to admin) -->
  <div id="admin-app" class="hidden">

    <!-- Sidebar -->
    <aside class="admin-sidebar" role="navigation" aria-label="Admin navigation">
      <a class="admin-logo" href="/">LG<span>.</span></a>

      <nav>
        <ul class="admin-nav">
          <li>
            <button class="admin-nav-btn active" data-tab="works" aria-current="true">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z"/></svg>
              Works
            </button>
          </li>
          <li>
            <button class="admin-nav-btn" data-tab="reviews">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 0 1 .865-.501 48.172 48.172 0 0 0 3.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z"/></svg>
              Reviews
            </button>
          </li>
        </ul>
      </nav>

      <div class="admin-sidebar-footer">
        <button class="admin-logout-btn" id="admin-logout-btn">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75"/></svg>
          Logout
        </button>
        <a href="/" class="admin-site-link">← View site</a>
      </div>
    </aside>

    <!-- Main content -->
    <main class="admin-main" role="main">

      <!-- Header -->
      <header class="admin-topbar">
        <h1 class="admin-page-title" id="admin-page-title">Works</h1>
        <div class="admin-user-info">
          <img class="admin-user-avatar" id="admin-user-avatar" src="" alt="" />
          <span id="admin-user-name"></span>
        </div>
      </header>

      <!-- ===== WORKS TAB ===== -->
      <section class="admin-tab active" id="tab-works" aria-labelledby="admin-page-title">

        <div class="admin-section-header">
          <p class="admin-count" id="works-admin-count">Loading…</p>
          <button class="btn-primary" id="btn-add-work">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
            Add work
          </button>
        </div>

        <div class="admin-works-list" id="admin-works-list">
          <div class="admin-loading"><div class="spinner"></div></div>
        </div>

      </section>

      <!-- ===== REVIEWS TAB ===== -->
      <section class="admin-tab hidden" id="tab-reviews" aria-labelledby="admin-page-title">

        <div class="admin-section-header">
          <p class="admin-count" id="reviews-admin-count">Loading…</p>
        </div>

        <div class="admin-reviews-list" id="admin-reviews-list">
          <div class="admin-loading"><div class="spinner"></div></div>
        </div>

      </section>

    </main>
  </div>

  <!-- ===== WORK MODAL ===== -->
  <div class="modal-overlay hidden" id="work-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Add work</h2>
        <button class="modal-close" id="modal-close" aria-label="Close modal">&times;</button>
      </div>

      <form id="work-form" novalidate>
        <input type="hidden" id="work-id" value="" />

        <div class="form-grid">
          <div class="form-field">
            <label for="work-title">Title *</label>
            <input type="text" id="work-title" name="title" placeholder="Project name" required />
          </div>

          <div class="form-field">
            <label for="work-technologies">Technologies (comma-separated)</label>
            <input type="text" id="work-technologies" name="technologies" placeholder="React, Node.js, PostgreSQL" />
          </div>

          <div class="form-field form-field-full">
            <label for="work-description">Description *</label>
            <textarea id="work-description" name="description" rows="4" placeholder="What did you build and why?" required></textarea>
          </div>

          <div class="form-field">
            <label for="work-live-url">Live URL</label>
            <input type="url" id="work-live-url" name="live_url" placeholder="https://example.com" />
          </div>

          <div class="form-field">
            <label for="work-github-url">GitHub URL</label>
            <input type="url" id="work-github-url" name="github_url" placeholder="https://github.com/..." />
          </div>

          <div class="form-field form-field-full">
            <label>Project image</label>
            <div class="image-upload-area" id="image-upload-area">
              <input type="file" id="work-image-input" accept="image/*" aria-label="Upload project image" />
              <div class="image-upload-placeholder" id="image-upload-placeholder">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="32" height="32"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5"/></svg>
                <span>Click to upload or drag &amp; drop</span>
              </div>
              <img class="image-preview hidden" id="image-preview" src="" alt="Preview" />
            </div>
            <input type="hidden" id="work-image-url" name="image_url" />
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-outline" id="btn-cancel-modal">Cancel</button>
          <button type="submit" class="btn-primary" id="btn-save-work">Save work</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/js/admin.js"></script>
</body>
</html>
